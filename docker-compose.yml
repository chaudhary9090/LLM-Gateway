services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_gateway_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LLM-Gateway
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - DATABASE_URL=sqlite+aiosqlite:////app/data/gateway.db
      - MOCK_PRIMARY_ENABLED=true
      - MOCK_SECONDARY_ENABLED=true
      - OPENAI_MAIN_ENABLED=false
      - OPENAI_BACKUP_ENABLED=false
    volumes:
      - gateway_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway_net

  redis:
    image: redis:7-alpine
    container_name: llm_gateway_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm_gateway_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - gateway_net

  ollama:
    image: ollama/ollama:latest
    container_name: llm_gateway_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gateway_net
    profiles:
      - local

  prometheus:
    image: prom/prometheus:latest
    container_name: llm_gateway_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gateway_net

  grafana:
    image: grafana/grafana:latest
    container_name: llm_gateway_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gateway_net

volumes:
  gateway_data:
  redis_data:
  ollama_data:

networks:
  gateway_net:
    driver: bridge

